# Rallee — identity tokens
# Read by /brand-bible when positioning / mission questions arise
# Last updated: 2026-05-12 (synced from brand-book v4)

name: Rallee People
short_name: Rallee
founder: Bree Hardie
based_in: Sydney, Australia
founded: 2024  # placeholder if unknown — update when confirmed

category: Boutique recruiting and team-building agency

positioning: |
  High-touch curator of senior talent + team culture, for premium-positioned
  Australian SMBs and scale-ups. Editorial brand presence, not transactional
  recruiting platform.

elevator_pitch: |
  Rallee places curated, vetted talent into senior roles AND helps companies
  rally their existing teams around shared culture and values. Founded by
  Bree Hardie. Naming is a play on "rally" — rooted in team sport and the
  founder's rugby / team-culture origin story.

what_we_are:
  - "Boutique recruiter — high-touch, curated, low-volume"
  - "Team-culture and culture-fit specialists, not body-shop"
  - "Editorial brand presence in a category of commodity templates"
  - "Premium-positioned, charging accordingly"
  - "Australian, founder-led, Sydney-rooted"

what_we_are_not:
  - "High-volume body shop"
  - "Digital recruiter masquerading as boutique (e.g., House of Chain)"
  - "Corporate-stiff or LinkedIn-template-prose"
  - "Generic recruitment platform"
  - "Stock-photography-and-handshake aesthetic"

founder_origin_story: |
  Bree's background in rugby / team culture is the brand DNA. "Rally" as a
  verb (rallying a team) is the linguistic centre. Use sparingly — bible
  flags "rally your team" overuse (4+ times on one page is too many).

competitive_positioning:
  primary_alternative: "In-house TA or commodity recruitment agency"
  why_we_win: "Cultural fit, time per candidate, advocacy beyond placement, founder accountability"
  pricing_posture: "Premium — does NOT compete on price"
